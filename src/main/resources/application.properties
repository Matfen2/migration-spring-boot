spring.application.name=stock-pieces

# Base H2 en mémoire : l'application se lance sans rien installer
spring.datasource.url=jdbc:h2:mem:stock;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Données de départ, chargées après la création des tables par Hibernate
spring.sql.init.data-locations=classpath:donnees.sql
spring.jpa.defer-datasource-initialization=true

# En-têtes HTTP volumineux (jetons des clients historiques)
server.max-http-request-header-size=16KB